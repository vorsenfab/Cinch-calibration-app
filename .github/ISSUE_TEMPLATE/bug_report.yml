name: Problem / question
description: Something doesn't work, or you have a question
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Meter model and firmware
      description: From the app's "Device info" section, e.g. CINCH52, firmware 7.93, hardware type 52 rev 2
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options: [Android app, Linux script, Other]
  - type: input
    id: phone
    attributes:
      label: Phone / Android version (or Linux distro)
  - type: textarea
    id: log
    attributes:
      label: Log
      description: Paste the text from the app's "Share log" button (Linux: copy the terminal output)
      render: text
